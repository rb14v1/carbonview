# Frontend Pipeline

default:
  tags:
    - node   # your runner tag

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "development"'

image: node:20

stages:
  - build
  - test
  - deploy

###############################
# FRONTEND: BUILD
###############################
build-frontend:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

###############################
# FRONTEND: TEST
###############################
unit-test-frontend:
  stage: test
  needs: ["build-frontend"]
  script:
    - cd frontend
    - npm test || echo "No tests yet"

lint-frontend:
  stage: test
  needs: ["build-frontend"]
  script:
    - cd frontend
    - npm run lint || echo "No lint script"

###############################
# DEPLOY: FRONTEND
###############################
deploy-frontend:
  image: ubuntu:22.04
  stage: deploy
  needs: ["build-frontend", "unit-test-frontend", "lint-frontend"]
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      set -euo pipefail

      echo "---- Safe apt update ----"
      rm -rf /var/lib/apt/lists/*
      attempts=0
      until apt-get update; do
        attempts=$((attempts+1))
        [ "$attempts" -ge 5 ] && exit 1
        sleep $((attempts * 5))
        rm -rf /var/lib/apt/lists/*
      done

      apt-get install -y --no-install-recommends zip curl ca-certificates

      : "${AZURE_FE_USER:?Missing AZURE_FE_USER}"
      : "${AZURE_FE_PASS:?Missing AZURE_FE_PASS}"

      echo "---- Zipping frontend ----"
      cd frontend/dist
      zip -r ../../frontend.zip .
      cd ../..

      FE_SCM_ROOT="https://carbonview-frontend-bbb8bye5fdhma3e2.scm.northeurope-01.azurewebsites.net"
      FE_DEPLOY_URL="${FE_SCM_ROOT}/api/zipdeploy"

      FE_PRECHECK_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" -u "${AZURE_FE_USER}:${AZURE_FE_PASS}" "${FE_SCM_ROOT}/")"
      echo "SCM Status: ${FE_PRECHECK_STATUS}"

      FE_STATUS="$(curl -sS -o fe_deploy_response.txt -w "%{http_code}" \
        -u "${AZURE_FE_USER}:${AZURE_FE_PASS}" \
        --data-binary "@frontend.zip" \
        "${FE_DEPLOY_URL}")"

      echo "Deploy status: ${FE_STATUS}"
      [ "${FE_STATUS}" = "200" ] || [ "${FE_STATUS}" = "202" ]
