server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    client_body_temp_path /tmp/nginx-cache;
    proxy_temp_path       /tmp/nginx-cache;
    fastcgi_temp_path     /tmp/nginx-cache;
    uwsgi_temp_path       /tmp/nginx-cache;
    scgi_temp_path        /tmp/nginx-cache;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Client-side routing: unknown paths are handed to the SPA, not 404'd.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
